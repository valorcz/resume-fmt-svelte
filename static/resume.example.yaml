      Led core transaction processing engine development and API infrastructure for 
      high-frequency institutional payments and settlement systems.
    highlights:
      - Designed and built a transactional ledger engine in Go and PostgreSQL supporting 12,000 transactions per second with strict ACID guarantees.
      - Reduced database lock contention by 75% by re-architecting payment batching and idempotency keys.
      - Established engineering best practices, CI/CD automated canary testing, and comprehensive threat modeling protocols.

  - name: Nexus Data Labs
    position: Systems Software Engineer
    url: https://nexusdatalabs.example.com
    location: Seattle, WA
    startDate: '2015-08-01'
    endDate: '2018-05-31'
