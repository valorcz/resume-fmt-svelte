# yaml-language-server: $schema=https://raw.githubusercontent.com/jsonresume/resume-schema/v1.0.0/schema.json

# ==============================================================================
# RESUME CONFIGURATION (Optional resume-fmt-svelte metadata & styling block)
# You can customize these settings directly or via the on-screen Resume Studio.
# ==============================================================================
_config:
  # Base typographic & layout archetype
  # Options: classic, modern-timeline, editorial, europass, executive-slate, 
  #          executive-baseline, noir-city, bio-vision, elegant-split, vibe-glow,
  #          tailwind-blueprint, the-verge, terminal, cyber-script, 8bit-demo, etc.
  theme: modern-timeline

  # Accent color override (HEX). Omit or set null for theme default.
  accent: '#2563eb'

  # Color display mode: 'system' | 'light' | 'dark'
  mode: system

  # Print paper format: 'a4' (210×297mm) | 'letter' (8.5×11in)
  paperFormat: a4

  # Print margins: '1.0cm', '1.5cm', '2.0cm' (A4) or '0.5in', '0.75in', '1.0in' (Letter)
  printMargin: '1.5cm'

  # Print scale squeeze percentage: 100, 95, 90, 85, 80, 75
  printScale: 100

  # Column layout ordering for themes supporting multi-column layouts
  layout:
    main:
      - work
      - projects
      - volunteer
      - publications
    sidebar:
      - skills
      - education
      - certificates
      - awards
      - languages
      - interests
      - references

