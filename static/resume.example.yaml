    highlights:
      - Built high-throughput gRPC and Kafka ingestion microservices handling real-time analytical workloads.
      - Developed automated load testing suites in Python and Rust simulating over 50,000 concurrent client sessions.
      - Improved cache hit ratios by 35% through custom LRU eviction algorithms and memory-mapped local storage.

