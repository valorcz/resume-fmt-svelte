projects:
  - name: Decentralized & Audited Managed IDS Solution
    description: Designed a decentralized, open-source manageable IDS solution resolving configuration inconsistencies.
    highlights:
      - Implemented a purely open-source solution using git, GitLab, and bash/Python to provide peer-reviewed, auditable, and reversible configurations.
      - Operated the system reliably in production for 3+ years, including proactive sensor health-check automation.
      - Despite the decentralized deployments and operations, the configuration could be done from a single point.

  - name: Secure SDLC Implementation & Trainings
    description: Designed and implemented a Secure SDLC process for the project development teams.
    highlights:
      - Ad-hoc 'coffee-and-learn' focused sessions.
      - More formal trainings and presentations covering the most problematic topics (OAuth, OIDC, TLS, encryption principles).

  - name: University Firewalls Project
    description: Deployed decentralized firewalls for various faculties to ensure auditable and error-free administration.
    highlights:
      - Utilized open-source solutions to establish a highly manageable architecture for local administrators.
      - Combined technical measures with wiki-based documentation and training to ensure secure and reliable operations.

  - name: Host Triage Automation
    description: Designed and implemented orchestration for an internal host triage and forensic investigation system.
    highlights:
      - Reduced initial host triage time significantly through automation and background evidence collection.
      - Recognized internally with an innovation award as part of a Six Sigma improvement initiative.


  - name: Secure Authentication Token
    description: Project focused on a novel implementation of a smartcards "firewall"
    highlights:
      - Applied finite-state automata theory to the design of a domain-specific language (DSL).
      - Enabled formal verification of firewall rule correctness.
      - Implemented the solution in assembly on custom hardware.

  - name: Training Courses for Junior Analysts
    description: Led multiple initiatives to design a structured onboarding process for my team of junior analysts.
    highlights:
      - Drafted step-by-step tutorials with increasing complexity of scenarios.
      - Built a workshop tooling and images for a close-to-real hands-on experience.
      - Started a series of internal seminars focused on various information security topics.
