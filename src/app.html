<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
		<script>
			(function() {
				try {
					var params = new URLSearchParams(window.location.search);
					var storedTheme = localStorage.getItem('resume-active-theme');
					var storedMode = localStorage.getItem('resume-color-mode');
					var storedAccent = localStorage.getItem('resume-accent-color');
					if (!params.get('theme') && storedTheme) {
						params.set('theme', storedTheme);
						if (storedAccent && !params.get('accent')) params.set('accent', storedAccent.replace('#', ''));
						if (storedMode && !params.get('mode')) params.set('mode', storedMode);
						var newSearch = params.toString();
						if (newSearch) {
							window.location.replace(window.location.pathname + '?' + newSearch);
						}
					}
				} catch(e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
